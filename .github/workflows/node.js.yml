# This workflow does a clean pnpm install, type-checks and lints the
# SvelteKit app, builds it, and runs its vitest suite (including the
# browser-mode tests, which need a real Chromium instance installed via
# Playwright).
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "ui/**"
      - ".github/workflows/node.js.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "ui/**"
      - ".github/workflows/node.js.yml"

permissions:
  contents: read

concurrency:
  group: node-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui

    steps:
    - uses: actions/checkout@v7

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        package_json_file: ui/package.json

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'pnpm'
        cache-dependency-path: ui/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}

    - name: Install Playwright's Chromium
      run: pnpm exec playwright install --with-deps chromium

    - name: Type-check
      run: pnpm run check

    - name: Lint
      run: pnpm run lint

    - name: Build
      run: pnpm run build

    - name: Test
      run: pnpm test
