# This workflow does a clean pnpm install, type-checks and lints the
# SvelteKit app, builds it, and runs its vitest suite (including the
# browser-mode tests, which need a real Chromium instance installed via
# Playwright).
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: node-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gates `build` below instead of workflow-level `on.*.paths` so the
  # workflow always triggers (and always posts a status) even on PRs that
  # don't touch ui/** -- see the identical comment in go.yml for why this
  # matters for required status checks.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          ui:
            - 'ui/**'
            - '.github/workflows/node.js.yml'

  build:
    name: Build & test UI
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui

    steps:
    - uses: actions/checkout@v7

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        package_json_file: ui/package.json

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'pnpm'
        cache-dependency-path: ui/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}

    - name: Install Playwright's Chromium
      run: pnpm exec playwright install --with-deps chromium

    - name: Type-check
      run: pnpm run check

    - name: Lint
      run: pnpm run lint

    - name: Build
      run: pnpm run build

    - name: Test
      run: pnpm test
