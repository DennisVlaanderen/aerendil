# Auto-merges Dependabot pull requests once every required check has
# passed. Patch/minor/digest updates always qualify; semver-major updates
# additionally need GitHub's public compatibility score to clear 80%.
#
# Runs as `pull_request_target` (not `pull_request`) because Dependabot-
# triggered `pull_request` events get a read-only GITHUB_TOKEN, which can't
# merge anything -- see
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions#enabling-auto-merge-on-a-pull-request.
# `pull_request_target` always runs the workflow file from the base branch
# (this file, not whatever a PR author's branch contains) and never checks
# out the PR's own code, so there's nothing here for an attacker to hijack
# by pushing to the PR branch -- every step below only talks to the GitHub
# API via the trusted event payload.
#
# If branch protection on `main` requires approving reviews, this workflow
# also casts that approval itself (as github-actions[bot], never as
# dependabot[bot] -- GitHub forbids self-approval, so this only works
# because the approver and the PR author are different identities) once
# the update-type/compatibility decision below clears. Any other branch-protection
# requirement this workflow can't itself satisfy -- a CODEOWNERS review
# from a specific human/team, a required check that never goes green, a
# merge conflict -- leaves the PR exactly where GitHub's native auto-merge
# puts it: queued and blocked, i.e. waiting on a human, which is the
# intended fallback rather than a bug to work around here.
#
# Prerequisites this workflow can't configure for you:
#   - Repository setting "Allow auto-merge" must be enabled (Settings >
#     General), otherwise the `gh pr merge --auto` step fails outright.
#   - Branch protection on `main` should have required status checks (Go,
#     Node.js, CodeQL, Docker, ...) so GitHub's native auto-merge actually
#     waits for "all other Actions pass" before merging -- this workflow
#     only flips the auto-merge switch, it doesn't itself wait for checks.
#   - A `DEPENDABOT_COMPAT_PAT` repository secret: a PAT (fine-grained,
#     read-only "Pull requests" + "Metadata" repo permissions is enough)
#     used only for the compatibility-score lookup. The default
#     GITHUB_TOKEN is explicitly rejected by dependabot/fetch-metadata for
#     `compat-lookup` (https://github.com/dependabot/fetch-metadata#compat-lookup).

name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.DEPENDABOT_COMPAT_PAT }}"
          compat-lookup: true

      # Patch, minor and digest-only updates always auto-merge: the required
      # CI checks (build, tests, lint, coverage, CodeQL, image builds) are
      # the real gate for those, and GitHub now publishes compatibility
      # scores for Go, Docker and GitHub Actions updates too. Those scores
      # are often low even for routine patch bumps (e.g. 55% for a golang
      # alpine patch release) because they're computed from public CI
      # history, so gating patch/minor on them left almost every update
      # waiting on a human.
      #
      # Only semver-major updates are held back by the score. A score of 0
      # is what fetch-metadata returns both when the update genuinely has
      # 0% known compatibility *and* when no score exists at all -- the
      # action doesn't distinguish the two -- so "no score" is treated as
      # non-blocking rather than as a failure.
      - name: Decide whether the update can auto-merge
        id: decision
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          SCORE: ${{ steps.metadata.outputs.compatibility-score }}
        run: |
          score="$SCORE"
          if [ "$UPDATE_TYPE" != "version-update:semver-major" ]; then
            echo "Update type '${UPDATE_TYPE:-unknown}' is not a major bump; CI is the gate."
            echo "merge=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$score" ] || [ "$score" -eq 0 ]; then
            echo "No known compatibility score for this update; not blocking on it."
            echo "merge=true" >> "$GITHUB_OUTPUT"
          elif [ "$score" -gt 80 ]; then
            echo "Compatibility score ${score}% clears the 80% threshold."
            echo "merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "Compatibility score ${score}% is at or below the 80% threshold; leaving for manual review."
            echo "merge=false" >> "$GITHUB_OUTPUT"
          fi

      # Satisfies a "require approving reviews" branch-protection rule so
      # auto-merge isn't left permanently queued waiting on a human who was
      # never going to review a routine dependency bump. Re-runs on every
      # `synchronize` (Dependabot rebase/recreate), so a rule that dismisses
      # stale approvals on new commits gets a fresh approval each time
      # rather than staying stuck. If a review from a specific person or
      # team is also required (CODEOWNERS), this approval alone won't clear
      # it -- the PR stays blocked for that human, same as today.
      - name: Approve pull request
        if: steps.decision.outputs.merge == 'true'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Enabling GitHub's native auto-merge (rather than merging directly)
      # is what actually satisfies "when all other Actions pass": it defers
      # the merge until every required status check on this PR succeeds,
      # and does nothing if the PR is later marked draft or a check fails.
      - name: Enable auto-merge
        if: steps.decision.outputs.merge == 'true'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
