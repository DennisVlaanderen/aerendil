# This workflow builds, tests, lints, and vulnerability-scans the Go backend.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Every job below is gated on this instead of workflow-level `on.*.paths`
  # so the workflow always triggers (and always posts a status) even on PRs
  # that don't touch backend/**. A path-filtered workflow that never
  # triggers never posts a status, which would leave a required check
  # permanently "pending" -- a job that's `if:`-skipped instead reports as
  # "skipped", which GitHub treats as a passing required check.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          backend:
            - 'backend/**'
            - 'go.mod'
            - 'go.sum'
            - '.golangci.yml'
            - '.github/workflows/go.yml'

  test:
    name: Test (Go ${{ matrix.go }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: [ "1.27", "stable" ]
    steps:
    - uses: actions/checkout@v7
      if: needs.changes.outputs.backend == 'true'

    - name: Set up Go
      if: needs.changes.outputs.backend == 'true'
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}

    - name: Verify dependencies
      if: needs.changes.outputs.backend == 'true'
      run: |
        go mod verify
        go mod download

    - name: Check go mod tidy
      if: needs.changes.outputs.backend == 'true'
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum

    - name: Build
      if: needs.changes.outputs.backend == 'true'
      run: go build -v ./...

    - name: Test
      if: needs.changes.outputs.backend == 'true'
      run: go test -v -race -shuffle=on -coverprofile=coverage.out ./...

    - name: Coverage summary
      if: needs.changes.outputs.backend == 'true'
      run: go tool cover -func=coverage.out | tail -1

    - name: Upload coverage artifact
      if: needs.changes.outputs.backend == 'true' && matrix.go == 'stable'
      uses: actions/upload-artifact@v7
      with:
        name: go-coverage
        path: coverage.out

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: go vet
      run: go vet ./...

    # On pull requests, only new issues (vs. the PR base) are reported so
    # incremental adoption on existing code doesn't block unrelated PRs; on
    # pushes to main the full-repo scan runs for visibility but is
    # non-blocking until the existing baseline has been cleaned up.
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      continue-on-error: ${{ github.event_name == 'push' }}
      with:
        version: latest
        only-new-issues: ${{ github.event_name == 'pull_request' }}

  govulncheck:
    name: Vulnerability check
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Run govulncheck
      uses: golang/govulncheck-action@v1
