# Build-validates the images docker-compose.yml depends on. Build-only: no
# registry push, no secrets required. This is what would have caught the
# backend Dockerfile pinning an older Go version than go.mod requires.
# Trivy findings are report-only (exit-code 0) until the base-image CVE
# baseline has been reviewed -- flip to exit-code 1 to make it blocking.

name: Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gates `backend`/`ui` below instead of workflow-level `on.*.paths` so the
  # workflow always triggers (and always posts a status) on every PR --
  # see the identical comment in go.yml for why this matters for required
  # status checks. Split into two filter keys (rather than one combined
  # list like before) so a backend-only PR doesn't wait on a UI image build
  # and vice versa.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          backend:
            - 'backend/**'
            - 'go.mod'
            - 'go.sum'
            - 'docker-compose.yml'
            - '.github/workflows/docker.yml'
          ui:
            - 'ui/**'
            - 'docker-compose.yml'
            - '.github/workflows/docker.yml'

  backend:
    name: Build backend image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v7

    - name: Build image
      run: docker build -f backend/Dockerfile -t aerendil-backend:ci .

    - name: Trivy scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: aerendil-backend:ci
        format: sarif
        output: trivy-backend.sarif
        severity: CRITICAL,HIGH
        exit-code: '0'

    - name: Upload Trivy results
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: trivy-backend.sarif
        category: trivy-backend

  ui:
    name: Build UI image
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v7

    - name: Build image
      run: docker build -f ui/Dockerfile -t aerendil-ui:ci ui

    - name: Trivy scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: aerendil-ui:ci
        format: sarif
        output: trivy-ui.sarif
        severity: CRITICAL,HIGH
        exit-code: '0'

    - name: Upload Trivy results
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: trivy-ui.sarif
        category: trivy-ui
